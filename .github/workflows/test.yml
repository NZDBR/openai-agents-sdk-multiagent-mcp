name: Tests
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: approvals_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test -d approvals_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_POSTGRES_DSN: postgresql://test:test-only-password@localhost:5432/approvals_test
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --locked
      - run: uv run python -m scripts.stage_apps --target demo
      - run: uv run python -m scripts.validate_deployment --target dev
      - run: uv run python -m scripts.validate_deployment --target prod
      - run: uv run python -m scripts.validate_deployment --target demo
      - run: uv run pytest -q
      - run: uv build --all-packages --wheel
  official-chat-ui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: e2e-chatbot-app-next/package-lock.json
      - run: npm ci
        working-directory: e2e-chatbot-app-next
      - run: npm run build
        working-directory: e2e-chatbot-app-next
