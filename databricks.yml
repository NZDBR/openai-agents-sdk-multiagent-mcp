bundle:
  name: store_operations_agent
variables:
  workspace_host:
    description: Target workspace HTTPS host
  app_name:
    description: Databricks App name
  model_endpoint:
    description: Agent model serving endpoint
  judge_model:
    description: Evaluation judge model serving endpoint
  genie_space_id:
    description: Genie One space ID
  lakebase_endpoint:
    description: Autoscaling endpoint resource path
  lakebase_branch:
    description: projects/<project>/branches/<branch>
  lakebase_database:
    description: projects/<project>/branches/<branch>/databases/<database>
  experiment_id:
    description: UC-trace-bound MLflow experiment ID
  sql_warehouse_id:
    description: Warehouse used for UC traces
  storetime_connection:
    description: UC connection for StoreTime MCP
  confluence_connection:
    description: UC connection for Confluence MCP
  storetime_read_tools:
    description: Audited comma-separated read-only tool names
  opstask_read_tools:
    description: Audited comma-separated lookup tool names
  confluence_read_tools:
    description: Audited comma-separated retrieval tool names
  opstask_create_tool:
    description: Actual deployed mutation tool name
  job_cluster_id:
    description: Existing DEV/PROD cluster for the background evaluation job
  workflow_job_id:
    description: Optional existing Workflow job override
    default: ${resources.jobs.store_operations_background.id}
  memory_schema:
    description: Lakebase SQL schema (app-owned namespace)
    default: store_ops
  opstask_argument_map:
    description: JSON mapping of reviewed fields to actual MCP schema
    default: '{"title": "title", "store_id": "store_id", "assignee": "assignee", "due_date":
      "due_date", "idempotency_key": "idempotency_key"}'
  opstask_result_id_field:
    default: task_id
    description: Actual task ID field returned by the MCP writer
  genie_mcp_url:
    default: ''
    description: Optional workspace-governed MCP URL override
  storetime_mcp_url:
    default: ''
    description: Optional workspace-governed MCP URL override
  opstask_mcp_url:
    default: ''
    description: Optional workspace-governed MCP URL override
  confluence_mcp_url:
    default: ''
    description: Optional workspace-governed MCP URL override
  job_service_principal:
    description: Service principal client ID used to execute background evaluations
  opstask_read_connection:
    description: Employee/OBO read-only OpsTask UC connection
  opstask_write_connection:
    description: Distinct OpsTask write UC connection, backend identity only
  opstask_write_mcp_url:
    description: Optional distinct workspace-governed write route override
    default: ''
  opstask_write_auth_mode:
    description: Backend app identity or explicitly configured m2m identity
    default: app
  opstask_write_oauth_scopes:
    description: Comma-separated supported backend MCP OAuth scopes, selected for
      the workspace
  opstask_approval_mode:
    description: application or application_and_gateway_ask; does not attach a platform
      policy
    default: application
  opstask_gateway_policy_id:
    description: Operator-managed optional write-service policy identifier; metadata,
      not proof of enforcement
    default: ''
  secret_scope:
    description: secret scope
    default: ''
  opstask_write_secret_key:
    description: opstask write secret key
    default: ''
  storetime_app_name:
    description: storetime app name
    default: ''
  storetime_public_host:
    description: storetime public host
    default: ''
  storetime_read_secret_key:
    description: storetime read secret key
    default: ''
  opstask_app_name:
    description: opstask app name
    default: ''
  opstask_public_host:
    description: opstask public host
    default: ''
  opstask_read_secret_key:
    description: opstask read secret key
    default: ''
  confluence_app_name:
    description: confluence app name
    default: ''
  confluence_public_host:
    description: confluence public host
    default: ''
  confluence_read_secret_key:
    description: confluence read secret key
    default: ''
  demo_storetime_mcp_url:
    description: Explicit HTTPS /mcp URL for selected demo App
    default: ''
  demo_opstask_mcp_url:
    description: Explicit HTTPS /mcp URL for selected demo App
    default: ''
  demo_confluence_mcp_url:
    description: Explicit HTTPS /mcp URL for selected demo App
    default: ''
  demo_mcp_allowed_hosts:
    description: Comma-separated exact deployed demo App hosts
    default: ''
  approval_service_principal:
    description: Least-privilege principal running approval workers; grant Lakebase
      and writer access
  approval_secret_scope:
    description: Secret scope readable only by the worker principal
  approval_client_id_key:
    description: M2M writer client ID secret key
  approval_client_secret_key:
    description: M2M writer client secret key
  approval_policy:
    description: 'Trusted JSON limits: ttl, lease, timeout, retries, backoff, backoff_cap
      (seconds except retries)'
    default: '{"ttl":86400,"lease":120,"timeout":45,"retries":5,"backoff":30,"backoff_cap":3600}'
workspace:
  host: ${var.workspace_host}
artifacts:
  agent_wheel:
    type: whl
    path: .
    build: uv build --package store-operations-agent --wheel
    files:
    - source: dist/store_operations_agent-*.whl
targets:
  dev:
    default: true
    mode: development
  prod:
    mode: production
include:
- deployment/agent.resources.yml
- deployment/workflow.resources.yml
- deployment/demo.resources.yml
sync:
  paths:
  - .deploy
  - jobs
  - dist
  include:
  - .deploy/**
  - dist/*.whl
  exclude:
  - .deploy/**/.venv/**
  - .deploy/**/__pycache__/**
  - .deploy/**/node_modules/**
  - .deploy/**/dist/**
  - jobs/__pycache__/**
  - dist/store_operations_demo_mcp-*.whl
