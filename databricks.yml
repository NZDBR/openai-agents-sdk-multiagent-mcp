# Modified official Databricks Apps bundle scaffold; all resource identities are variables.
bundle:
  name: store_operations_agent
variables:
  workspace_host:
    description: Target workspace HTTPS host
  app_name:
    description: Databricks App name
  model_endpoint:
    description: Agent model serving endpoint
  judge_model:
    description: Evaluation judge model serving endpoint
  genie_space_id:
    description: Genie One space ID
  lakebase_endpoint:
    description: Autoscaling endpoint resource path
  lakebase_branch:
    description: projects/<project>/branches/<branch>
  lakebase_database:
    description: projects/<project>/branches/<branch>/databases/<database>
  experiment_id:
    description: UC-trace-bound MLflow experiment ID
  sql_warehouse_id:
    description: Warehouse used for UC traces
  storetime_connection:
    description: UC connection for StoreTime MCP
  opstask_connection:
    description: UC connection for OpsTask MCP
  confluence_connection:
    description: UC connection for Confluence MCP
  storetime_read_tools:
    description: Audited comma-separated read-only tool names
  opstask_read_tools:
    description: Audited comma-separated lookup tool names
  confluence_read_tools:
    description: Audited comma-separated retrieval tool names
  opstask_create_tool:
    description: Actual deployed mutation tool name
  job_cluster_id:
    description: Existing DEV/PROD cluster for the background evaluation job
  workflow_job_id:
    description: Optional existing Workflow job override
    default: ${resources.jobs.store_operations_background.id}
  memory_schema:
    description: Lakebase SQL schema (app-owned namespace)
    default: store_ops
  opstask_argument_map:
    description: JSON mapping of reviewed fields to actual MCP schema
    default: '{"title": "title", "store_id": "store_id", "assignee": "assignee", "due_date":
      "due_date", "idempotency_key": "idempotency_key"}'
  opstask_result_id_field:
    default: task_id
    description: Actual task ID field returned by the MCP writer
  genie_mcp_url:
    default: ''
    description: Optional workspace-governed MCP URL override
  storetime_mcp_url:
    default: ''
    description: Optional workspace-governed MCP URL override
  opstask_mcp_url:
    default: ''
    description: Optional workspace-governed MCP URL override
  confluence_mcp_url:
    default: ''
    description: Optional workspace-governed MCP URL override
  job_service_principal:
    description: Service principal client ID used to execute background evaluations
workspace:
  host: ${var.workspace_host}
artifacts:
  agent_wheel:
    type: whl
    path: .
    build: uv build --wheel
resources:
  apps:
    store_operations:
      name: ${var.app_name}
      description: Governed Store Operations Agent · official Databricks OpenAI SDK
        scaffold
      source_code_path: ./
      config:
        command:
        - uv
        - run
        - start-app
        env:
        - name: MODEL_ENDPOINT
          value: ${var.model_endpoint}
        - name: GENIE_SPACE_ID
          value: ${var.genie_space_id}
        - name: LAKEBASE_ENDPOINT
          value: ${var.lakebase_endpoint}
        - name: LAKEBASE_AGENT_MEMORY_SCHEMA
          value: ${var.memory_schema}
        - name: STORE_OPS_SCHEMA
          value: ${var.memory_schema}
        - name: MLFLOW_EXPERIMENT_ID
          value: ${var.experiment_id}
        - name: MLFLOW_TRACING_SQL_WAREHOUSE_ID
          value: ${var.sql_warehouse_id}
        - name: MLFLOW_TRACKING_URI
          value: databricks
        - name: MLFLOW_REGISTRY_URI
          value: databricks-uc
        - name: API_PROXY
          value: http://localhost:8000/invocations
        - name: CHAT_APP_PORT
          value: '3000'
        - name: CHAT_PROXY_TIMEOUT_SECONDS
          value: '300'
        - name: DATABRICKS_WORKFLOW_JOB_ID
          value: ${var.workflow_job_id}
        - name: OPSTASK_CREATE_TOOL
          value: ${var.opstask_create_tool}
        - name: OPSTASK_ARGUMENT_MAP
          value: ${var.opstask_argument_map}
        - name: OPSTASK_RESULT_ID_FIELD
          value: ${var.opstask_result_id_field}
        - name: STORETIME_CONNECTION
          value: ${var.storetime_connection}
        - name: STORETIME_READ_TOOLS
          value: ${var.storetime_read_tools}
        - name: OPSTASK_CONNECTION
          value: ${var.opstask_connection}
        - name: OPSTASK_READ_TOOLS
          value: ${var.opstask_read_tools}
        - name: CONFLUENCE_CONNECTION
          value: ${var.confluence_connection}
        - name: CONFLUENCE_READ_TOOLS
          value: ${var.confluence_read_tools}
        - name: GENIE_MCP_URL
          value: ${var.genie_mcp_url}
        - name: STORETIME_MCP_URL
          value: ${var.storetime_mcp_url}
        - name: OPSTASK_MCP_URL
          value: ${var.opstask_mcp_url}
        - name: CONFLUENCE_MCP_URL
          value: ${var.confluence_mcp_url}
      resources:
      - name: experiment
        experiment:
          experiment_id: ${var.experiment_id}
          permission: CAN_MANAGE
      - name: llm-endpoint
        serving_endpoint:
          name: ${var.model_endpoint}
          permission: CAN_QUERY
      - name: genie-space
        genie_space:
          name: Genie One
          space_id: ${var.genie_space_id}
          permission: CAN_RUN
      - name: postgres
        postgres:
          branch: ${var.lakebase_branch}
          database: ${var.lakebase_database}
          permission: CAN_CONNECT_AND_CREATE
      - name: background-job
        job:
          id: ${var.workflow_job_id}
          permission: CAN_MANAGE_RUN
      - name: storetime-mcp
        uc_securable:
          securable_full_name: ${var.storetime_connection}
          securable_type: CONNECTION
          permission: USE_CONNECTION
      - name: opstask-mcp
        uc_securable:
          securable_full_name: ${var.opstask_connection}
          securable_type: CONNECTION
          permission: USE_CONNECTION
      - name: confluence-mcp
        uc_securable:
          securable_full_name: ${var.confluence_connection}
          securable_type: CONNECTION
          permission: USE_CONNECTION
  jobs:
    store_operations_background:
      name: ${var.app_name}-evaluation
      max_concurrent_runs: 1
      tasks:
      - task_key: evaluate
        existing_cluster_id: ${var.job_cluster_id}
        notebook_task:
          notebook_path: ./jobs/evaluate_notebook.py
          base_parameters:
            deployment_config: '{"MODEL_ENDPOINT": "${var.model_endpoint}", "GENIE_SPACE_ID":
              "${var.genie_space_id}", "LAKEBASE_ENDPOINT": "${var.lakebase_endpoint}",
              "LAKEBASE_AGENT_MEMORY_SCHEMA": "${var.memory_schema}", "STORE_OPS_SCHEMA":
              "${var.memory_schema}", "MLFLOW_EXPERIMENT_ID": "${var.experiment_id}",
              "MLFLOW_TRACING_SQL_WAREHOUSE_ID": "${var.sql_warehouse_id}", "MLFLOW_TRACKING_URI":
              "databricks", "MLFLOW_REGISTRY_URI": "databricks-uc", "OPSTASK_CREATE_TOOL":
              "${var.opstask_create_tool}", "OPSTASK_ARGUMENT_MAP": "${var.opstask_argument_map}",
              "OPSTASK_RESULT_ID_FIELD": "${var.opstask_result_id_field}", "STORETIME_CONNECTION":
              "${var.storetime_connection}", "STORETIME_READ_TOOLS": "${var.storetime_read_tools}",
              "OPSTASK_CONNECTION": "${var.opstask_connection}", "OPSTASK_READ_TOOLS":
              "${var.opstask_read_tools}", "CONFLUENCE_CONNECTION": "${var.confluence_connection}",
              "CONFLUENCE_READ_TOOLS": "${var.confluence_read_tools}", "GENIE_MCP_URL":
              "${var.genie_mcp_url}", "STORETIME_MCP_URL": "${var.storetime_mcp_url}",
              "OPSTASK_MCP_URL": "${var.opstask_mcp_url}", "CONFLUENCE_MCP_URL": "${var.confluence_mcp_url}",
              "BACKGROUND_JOB_ID": "0", "ALLOW_LOCAL_PROFILE_IDENTITY": "true"}'
            judge_model: databricks:/${var.judge_model}
        libraries:
        - whl: ./dist/*.whl
      run_as:
        service_principal_name: ${var.job_service_principal}
targets:
  dev:
    default: true
    mode: development
  prod:
    mode: production
