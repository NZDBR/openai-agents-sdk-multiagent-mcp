bundle:
  name: store_operations_demo_mcps
variables:
  workspace_host:
    description: workspace host
  secret_scope:
    description: secret scope
  opstask_write_secret_key:
    description: opstask write secret key
  storetime_app_name:
    description: storetime app name
  storetime_public_host:
    description: storetime public host
  storetime_read_secret_key:
    description: storetime read secret key
  opstask_app_name:
    description: opstask app name
  opstask_public_host:
    description: opstask public host
  opstask_read_secret_key:
    description: opstask read secret key
  confluence_app_name:
    description: confluence app name
  confluence_public_host:
    description: confluence public host
  confluence_read_secret_key:
    description: confluence read secret key
workspace:
  host: ${var.workspace_host}
resources:
  apps:
    storetime:
      name: ${var.storetime_app_name}
      source_code_path: ../
      config:
        command:
        - uv
        - run
        - demo-storetime
        env:
        - name: MCP_READ_TOKEN
          valueFrom: read-token
        - name: MCP_PUBLIC_HOST
          value: ${var.storetime_public_host}
      resources:
      - name: read-token
        secret:
          scope: ${var.secret_scope}
          key: ${var.storetime_read_secret_key}
          permission: READ
    opstask:
      name: ${var.opstask_app_name}
      source_code_path: ../
      config:
        command:
        - uv
        - run
        - demo-opstask
        env:
        - name: MCP_READ_TOKEN
          valueFrom: read-token
        - name: MCP_PUBLIC_HOST
          value: ${var.opstask_public_host}
        - name: MCP_WRITE_TOKEN
          valueFrom: write-token
        - name: MCP_TASK_DB
          value: .demo-data/tasks.db
      resources:
      - name: read-token
        secret:
          scope: ${var.secret_scope}
          key: ${var.opstask_read_secret_key}
          permission: READ
      - name: write-token
        secret:
          scope: ${var.secret_scope}
          key: ${var.opstask_write_secret_key}
          permission: READ
    confluence:
      name: ${var.confluence_app_name}
      source_code_path: ../
      config:
        command:
        - uv
        - run
        - demo-confluence
        env:
        - name: MCP_READ_TOKEN
          valueFrom: read-token
        - name: MCP_PUBLIC_HOST
          value: ${var.confluence_public_host}
      resources:
      - name: read-token
        secret:
          scope: ${var.secret_scope}
          key: ${var.confluence_read_secret_key}
          permission: READ
targets:
  dev:
    mode: development
  prod:
    mode: production
