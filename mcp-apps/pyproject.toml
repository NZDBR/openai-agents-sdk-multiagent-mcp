[project]
name = "store-operations-demo-mcp"
version = "0.1.0"
description = "Explicit synthetic StoreTime, OpsTask and Confluence MCP apps"
requires-python = ">=3.11"
dependencies = ["mcp>=1.30,<2", "pydantic>=2.12", "jsonschema>=4.23", "uvicorn>=0.41.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
demo-storetime = "storetime.server:main"
demo-opstask = "opstask.server:main"
demo-confluence = "confluence.server:main"

[tool.hatch.build.targets.wheel]
packages = ["shared", "storetime", "opstask", "confluence"]

[tool.hatch.build.targets.wheel.force-include]
"data" = "shared/data"
