[project]
name = "store-operations-agent"
version = "0.1.0"
description = "MLflow-compatible agent server with short-term memory and long-running background task support"
readme = "README.md"
authors = [
    { name = "Agent Developer", email = "developer@example.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.129.0",
    "uvicorn>=0.41.0",
    "mlflow>=3.11.1",
    "openai-agents>=0.4.1",
    "python-dotenv>=1.2.1",
    "uuid-utils>=0.10.0",
    "databricks-openai[memory]>=0.15.0",
    "databricks-sdk>=0.79.0",
    "databricks-agents>=1.9.3",
    "databricks-ai-bridge[agent-server]>=0.19.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.25.0",
    "pydantic>=2.12",
    "httpx>=0.28",
    "PyYAML>=6",
    "mcp>=1.30,<2",
    "jsonschema>=4.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_server", "scripts", "evaluations", "jobs", "mcp-apps/shared", "mcp-apps/storetime", "mcp-apps/opstask", "mcp-apps/confluence"]


[dependency-groups]
dev = [
    "hatchling>=1.28.0",
    "pytest>=9.0.2",
    "pytest-xdist>=3.8.0",
]

setup = [
    "ruamel.yaml>=0.18.0",
]

[tool.uv]
# Dependency cooldown: skip package versions published in the last 7 days (uv >= 0.9.17)
exclude-newer = "7 days"
default-groups = ["dev", "setup"]

[tool.pytest.ini_options]
testpaths = ["tests", "mcp-apps/tests"]
pythonpath = [".", "mcp-apps"]
markers = ["integration: requires explicitly configured live Databricks resources"]

[project.scripts]
quickstart = "scripts.quickstart:main"
start-app = "scripts.start_app:main"
start-server = "agent_server.start_server:main"
agent-evaluate = "evaluations.run:main"
discover-tools = "scripts.discover_tools:main"
preflight = "scripts.preflight:main"
demo-storetime = "storetime.server:main"
demo-opstask = "opstask.server:main"
demo-confluence = "confluence.server:main"

[tool.hatch.build.targets.wheel.force-include]
"mcp-apps/data" = "shared/data"
