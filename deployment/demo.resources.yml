targets:
  demo:
    mode: development
    resources:
      apps:
        storetime:
          name: ${var.storetime_app_name}
          source_code_path: ../.deploy/storetime
          config:
            command:
            - uv
            - run
            - --frozen
            - --package
            - store-operations-demo-mcp
            - --no-default-groups
            - demo-storetime
            env:
            - name: MCP_READ_TOKEN
              value_from: read-token
            - name: MCP_PUBLIC_HOST
              value: ${var.storetime_public_host}
          resources:
          - name: read-token
            secret:
              scope: ${var.secret_scope}
              key: ${var.storetime_read_secret_key}
              permission: READ
        opstask:
          name: ${var.opstask_app_name}
          source_code_path: ../.deploy/opstask
          config:
            command:
            - uv
            - run
            - --frozen
            - --package
            - store-operations-demo-mcp
            - --no-default-groups
            - demo-opstask
            env:
            - name: MCP_READ_TOKEN
              value_from: read-token
            - name: MCP_PUBLIC_HOST
              value: ${var.opstask_public_host}
            - name: MCP_WRITE_TOKEN
              value_from: write-token
            - name: MCP_TASK_DB
              value: .demo-data/tasks.db
          resources:
          - name: read-token
            secret:
              scope: ${var.secret_scope}
              key: ${var.opstask_read_secret_key}
              permission: READ
          - name: write-token
            secret:
              scope: ${var.secret_scope}
              key: ${var.opstask_write_secret_key}
              permission: READ
        confluence:
          name: ${var.confluence_app_name}
          source_code_path: ../.deploy/confluence
          config:
            command:
            - uv
            - run
            - --frozen
            - --package
            - store-operations-demo-mcp
            - --no-default-groups
            - demo-confluence
            env:
            - name: MCP_READ_TOKEN
              value_from: read-token
            - name: MCP_PUBLIC_HOST
              value: ${var.confluence_public_host}
          resources:
          - name: read-token
            secret:
              scope: ${var.secret_scope}
              key: ${var.confluence_read_secret_key}
              permission: READ
        store_operations:
          config:
            env:
            - name: MCP_CONNECTION_MODE
              value: deployed_demo
            - name: DEMO_MCP_ALLOWED_HOSTS
              value: ${var.demo_mcp_allowed_hosts}
            - name: STORETIME_MCP_URL
              value: ${var.demo_storetime_mcp_url}
            - name: DEMO_STORETIME_READ_TOKEN
              value_from: demo-storetime-read-token
            - name: OPSTASK_MCP_URL
              value: ${var.demo_opstask_mcp_url}
            - name: DEMO_OPSTASK_READ_TOKEN
              value_from: demo-opstask-read-token
            - name: CONFLUENCE_MCP_URL
              value: ${var.demo_confluence_mcp_url}
            - name: DEMO_CONFLUENCE_READ_TOKEN
              value_from: demo-confluence-read-token
            - name: STORETIME_READ_TOOLS
              value: get_schedules,get_training_blocks,get_training_hours,get_coverage_reasons,diagnose_training_gap
            - name: OPSTASK_READ_TOOLS
              value: list_followups,get_task
            - name: CONFLUENCE_READ_TOOLS
              value: search_company_context,get_policy_document
            - name: OPSTASK_CREATE_TOOL
              value: create_task
          resources:
          - name: demo-storetime-read-token
            secret:
              scope: ${var.secret_scope}
              key: ${var.storetime_read_secret_key}
              permission: READ
          - name: demo-opstask-read-token
            secret:
              scope: ${var.secret_scope}
              key: ${var.opstask_read_secret_key}
              permission: READ
          - name: demo-confluence-read-token
            secret:
              scope: ${var.secret_scope}
              key: ${var.confluence_read_secret_key}
              permission: READ
          name: ${var.app_name}
      jobs:
        store_operations_approval_execution:
          name: ${var.app_name}-approval-execution
          max_concurrent_runs: 10
          parameters:
          - name: approval_id
            default: ''
          run_as:
            service_principal_name: ${var.approval_service_principal}
          tasks:
          - task_key: execute_approval
            existing_cluster_id: ${var.job_cluster_id}
            timeout_seconds: 300
            max_retries: 0
            notebook_task:
              notebook_path: ../jobs/execute_approval_notebook.py
              base_parameters:
                approval_id: '{{job.parameters.approval_id}}'
                deployment_config: '{"MODEL_ENDPOINT": "${var.model_endpoint}", "GENIE_SPACE_ID":
                  "${var.genie_space_id}", "LAKEBASE_ENDPOINT": "${var.lakebase_endpoint}",
                  "LAKEBASE_AGENT_MEMORY_SCHEMA": "${var.memory_schema}", "STORE_OPS_SCHEMA":
                  "${var.memory_schema}", "MLFLOW_EXPERIMENT_ID": "${var.experiment_id}",
                  "MLFLOW_TRACING_SQL_WAREHOUSE_ID": "${var.sql_warehouse_id}", "MLFLOW_TRACKING_URI":
                  "databricks", "MLFLOW_REGISTRY_URI": "databricks-uc", "OPSTASK_CREATE_TOOL":
                  "create_task", "OPSTASK_ARGUMENT_MAP": "${var.opstask_argument_map}",
                  "OPSTASK_RESULT_ID_FIELD": "${var.opstask_result_id_field}", "STORETIME_CONNECTION":
                  "${var.storetime_connection}", "STORETIME_READ_TOOLS": "${var.storetime_read_tools}",
                  "OPSTASK_READ_TOOLS": "${var.opstask_read_tools}", "CONFLUENCE_CONNECTION":
                  "${var.confluence_connection}", "CONFLUENCE_READ_TOOLS": "${var.confluence_read_tools}",
                  "GENIE_MCP_URL": "${var.genie_mcp_url}", "STORETIME_MCP_URL": "${var.demo_storetime_mcp_url}",
                  "OPSTASK_MCP_URL": "${var.demo_opstask_mcp_url}", "CONFLUENCE_MCP_URL":
                  "${var.demo_confluence_mcp_url}", "BACKGROUND_JOB_ID": "0", "OPSTASK_READ_CONNECTION":
                  "${var.opstask_read_connection}", "USER_AUTHORIZATION_MODE": "obo",
                  "OPSTASK_WRITE_CONNECTION": "${var.opstask_write_connection}", "OPSTASK_WRITE_MCP_URL":
                  "${var.opstask_write_mcp_url}", "OPSTASK_WRITE_AUTH_MODE": "m2m",
                  "OPSTASK_WRITE_OAUTH_SCOPES": "${var.opstask_write_oauth_scopes}",
                  "OPSTASK_APPROVAL_MODE": "${var.opstask_approval_mode}", "OPSTASK_GATEWAY_POLICY_ID":
                  "${var.opstask_gateway_policy_id}", "MCP_CONNECTION_MODE": "deployed_demo",
                  "DEMO_MCP_ALLOWED_HOSTS": "${var.demo_mcp_allowed_hosts}", "DATABRICKS_HOST":
                  "${var.workspace_host}"}'
                secret_scope: ${var.secret_scope}
                client_id_key: ${var.approval_client_id_key}
                client_secret_key: ${var.approval_client_secret_key}
                demo_write_key: ${var.opstask_write_secret_key}
                policy_config: ${var.approval_policy}
            libraries:
            - whl: ../dist/store_operations_agent-*.whl
          permissions:
          - service_principal_name: ${var.job_service_principal}
            level: CAN_MANAGE_RUN
